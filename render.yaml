# Déploiement Render (« Blueprint ») : le site et sa base PostgreSQL, sur les offres gratuites.
services:
  - type: web
    name: notation-rapports
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /sante
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: CLE_SUIVI
        generateValue: true
      - key: CODE_ACCES
        sync: false          # saisi dans le tableau de bord Render (laisser vide pour un lien ouvert)
      - key: DATABASE_URL
        fromDatabase:
          name: notation-db
          property: connectionString

databases:
  - name: notation-db
    plan: free
    region: frankfurt
